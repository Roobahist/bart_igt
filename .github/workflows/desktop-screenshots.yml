name: Desktop English screenshots
on:
  workflow_dispatch:
  push:
    branches: [docs/english-screenshots]
    paths:
      - apps/desktop/experiment.py
      - apps/desktop/presentation.py
      - study/settings.py
      - study/locales/**
      - assets/fonts/plus-jakarta-sans/**
      - apps/desktop/localization.py
      - scripts/capture_desktop_screenshots.py
      - .github/workflows/desktop-screenshots.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/desktop.txt
      - name: Install display support on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libportaudio2 fonts-liberation
      - name: Install PsychoPy on the disposable runner
        run: python -m pip install -r requirements/desktop.txt
      - name: Render English screenshots
        run: xvfb-run -a -s '-screen 0 1440x900x24' python scripts/capture_desktop_screenshots.py --output work/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: english-screenshots
          path: work/screenshots
          if-no-files-found: warn
          retention-days: 7
