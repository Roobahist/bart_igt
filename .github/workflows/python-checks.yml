name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/development.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q apps/desktop study scripts
      - run: python -m unittest discover -s tests/desktop -v
      - run: pip-audit --strict --no-deps --disable-pip -r requirements/results.txt
