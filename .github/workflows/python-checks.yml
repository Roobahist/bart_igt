name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/development.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q apps/desktop study scripts
      - run: python -m unittest discover -s tests/desktop -v
      - run: pip-audit --strict --no-deps --disable-pip -r requirements/results.txt
